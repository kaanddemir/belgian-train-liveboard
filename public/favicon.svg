<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Master application icon: a train front on its track, embedded as
       a raster so every icon size comes from the same artwork. -->
  <defs>
    <clipPath id="icon-shape">
      <rect width="512" height="512" rx="72"/>
    </clipPath>
  </defs>
  <image clip-path="url(#icon-shape)" width="512" height="512" href="data:image/png;base64,"/>
</svg>
