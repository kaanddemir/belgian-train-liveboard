<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Master application icon. The custom B combines a train windscreen in
       its upper counter with a rounded train front and headlights below. -->
  <defs>
    <clipPath id="icon-shape">
      <rect width="512" height="512" rx="72"/>
    </clipPath>
  </defs>

  <g clip-path="url(#icon-shape)">
    <rect width="512" height="512" fill="#0f3054"/>
    <rect width="512" height="80" fill="#008fe8"/>
  </g>

  <path fill="#ffcc05" fill-rule="evenodd" d="
    M160 142H284c62 0 100 31 100 81 0 28-14 51-40 65
    36 16 56 46 56 82 0 50-40 76-108 76H160c-21 0-34-13-34-34V176
    c0-21 13-34 34-34Z

    M184 184c-7 0-10 4-10 11v52c0 8 4 11 11 11h94
    c33 0 51-13 51-37 0-23-19-37-51-37h-95Z

    M184 318c-8 0-12 4-12 12v62c0 8 4 12 12 12h103
    c38 0 59-14 59-42 0-27-21-44-59-44H184Z"/>

  <!-- The windscreen dividers and headlights are part of the B itself,
       keeping the train cue legible without introducing a separate mark. -->
  <path fill="#ffcc05" d="M220 192h20l-35 58h-20Zm37 0h20l-35 58h-20Z"/>
  <circle cx="207" cy="370" r="13" fill="#ffcc05"/>
